<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="card" id="topic">お題</div>
    <h2>自分の数字をお題に沿った言葉で表し、全員の数字を予想しよう</h2>
    <h1>議論時間</h1>
    <h1 id="timer">3:00</h1>
    <button id="finishDiscussion">結果発表へ</button>


<script>
    const topic = localStorage.getItem("topic");

    document.getElementById("topic").textContent = "お題：" + topic;

    // タイマーの設定
    let timeLeft = 180; // 3分 = 180秒

    const timer = document.getElementById("timer");

    // タイマー表示を更新する関数
    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        timer.textContent =
            minutes + ":" + String(seconds).padStart(2, "0");
    }

    // カウントダウン開始
    const countdown = setInterval(() => {
        timeLeft--;

        updateTimer();

        // 0秒になったら停止
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timer.textContent = "時間終了！";
        }
    }, 1000);

    // 結果発表ボタン
    document.getElementById("finishDiscussion").addEventListener("click", () => {
        clearInterval(countdown);
        location.href = "result.html";
    });

    // 最初の表示
    updateTimer();
</script>

</body>
</html>
